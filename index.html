<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retros Flow · MVP</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="./logo.svg" alt=""><span>RETROS</span></div>
      <div class="progress"><span id="progressBar"></span></div>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <button id="backBtn" class="ghost">← Atrás</button>
      <div class="footer-center">
        <div id="stepLabel">1 / 8</div>
        <button id="toolFeedbackBtn" class="tool-feedback-cta" type="button">Sumá tu feedback! 📢</button>
      </div>
      <button id="nextBtn" class="primary">Comenzar →</button>
    </footer>

    <div id="toolFeedbackModal" class="tool-feedback-modal" aria-hidden="true">
      <div class="tool-feedback-backdrop" data-tool-feedback-close></div>
      <div class="tool-feedback-dialog" role="dialog" aria-modal="true" aria-labelledby="toolFeedbackTitle">
        <button type="button" class="tool-feedback-close" id="toolFeedbackCloseBtn" aria-label="Cerrar">×</button>
        <h2 id="toolFeedbackTitle">¿Qué mejorarías de la herramienta?</h2>
        <p class="lead">Contanos qué te gustaría cambiar, mejorar o sumar.</p>
        <textarea id="toolFeedbackInput" maxlength="2000" rows="6" placeholder="Escribí tu sugerencia..."></textarea>
        <div class="tool-feedback-meta"><span id="toolFeedbackCounter">0 / 2000</span></div>
        <div class="tool-feedback-actions">
          <button type="button" class="ghost tool-feedback-cancel" data-tool-feedback-close>Cancelar</button>
          <button type="button" class="primary" id="toolFeedbackSubmitBtn">Enviar feedback →</button>
        </div>
        <div id="toolFeedbackStatus" class="tool-feedback-status" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
